# 可复用页面布局：文件名（不带 .yml）就是布局 ID。
# 在 config.yml 的 layout.by-page 中绑定页码；本文件不再填写 page。
# size 可省略以使用主配置默认值；title 也可按布局覆盖。
size: 9

# 当前页通过 AccessoryService API 在运行时禁用的槽位样式
disabled-slot:
  item:
    type: "RED_STAINED_GLASS_PANE"
    hide-tooltip: true
    name: "<red>Slot Disabled"
    lore:
      - "<dark_red>This slot is disabled"

Accessory:
  "1":
    lore:
      - "[Ring]"

# action: "command" 时点击该物品会执行 command.console / command.player；也支持 "previous_page" / "next_page" 翻页。
frame:
  locked:
    slots: [2, 4, 6]
    type: "BLACK_STAINED_GLASS_PANE"
    custom-model-data: 12345
    hide-tooltip: true
    name: "<gray>Locked"
    lore:
      - "<dark_gray>Slot is locked"

  previous_button:
    slots: [0]
    type: "ARROW"
    custom-model-data: 12345
    hide-tooltip: true
    name: "<gray>Previous Page"
    lore:
      - "<dark_gray>Go to previous page"
    action: "previous_page"

  command_button:
    slots: [7]
    type: "BOOK"
    hide-tooltip: false
    name: "<aqua>Command Button"
    lore:
      - "<gray>Click to run configured commands"
    action: "command"
    command:
      console:
        - "say {player} clicked accessory page {page} slot {slot}"
      player:
        - "help"
