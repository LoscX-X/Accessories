# 全局显示默认值；layouts/*.yml 可分别覆盖 title / size。
title: "<gradient:#00ffa6:#00d1ff><b>Accessories {page}/{max_page}</b></gradient>"
size: 9

# 页面管理采用 ExcellentShop 的“页数 + 默认布局 + 逐页布局”方式。
# 页数只由这里决定（1-100），增加布局文件不会自动增加页数。
pages: 2
layout:
  # false: 所有页共用 by-page.0；true: 允许其他页单独指定布局。
  paginated: true
  by-page:
    # 0 代表默认布局；值为 layouts/ 下的文件名，不含扩展名。
    "0": default
    "2": extra

# 页面槽位、边框、按钮和禁用样式仅配置在 layouts/*.yml。
# 旧 page/*.yml、主配置 Accessory/frame/disabled-slot 不再读取。
# 完整配置关系与升级方式见 docs/configuration.md。

# Language/ 中的文件名，不带 .yml；消息支持 MiniMessage。
Lang: "en_US"
debug-mode: false
skill-debug: false

# 快速装备：潜行 + 主手右键；多个匹配槽位会显示可点击选项。
quick-equip:
  shift-right-click: true

# 已装备物品包含任意关键词时，不能卸下或被快捷装备替换。
anti-unequip:
  lore:
    - "[Anti-unequip]"

# 同一物品的装备/生效数量限制，与 skill/*.yml 的 items ID 可以对应。
# 支持 id、name（字符串/列表）、lore（列表）、material；max <= 0 不限制。
# 未指定 id 时，规则键名同时作为 ID、名称及 lore 关键词兜底。
item-limits:
  example_ring:
    id: example_ring
    max: 1

# 属性来源自动选择：BlancAttribute > AttributePlus > AuraSkills > 原版。
# 以下 Lore 映射仅在原版模式生效；原 attribute-plus.enable 无效开关已移除。
# 例：生命: +5 / 生命: -5 / 生命: x1.2（倍率 1.2 自动换算为 +0.2）。
vanilla-lore-attributes:
  enable: false
  mappings:
    health:
      attribute: "minecraft:max_health"
      keywords: ["生命", "health"]

# AuraSkills 物理/魔法护盾：脱战时间单位为秒，恢复比例每秒应用一次。
# 两组设置均支持 /accessory reload。
OUT_OF_COMBAT_SECONDS: 12
SHIELD_REGEN_PERCENT: 0.10
MAGIC_SHIELD_OUT_OF_COMBAT_SECONDS: 12
MAGIC_SHIELD_REGEN_PERCENT: 0.10
Life_Steal_demonstrate: false

# 存储方式：yml / mysql / only-ram。
# only-ram 不落盘；普通配置重载保留内存，切换存储或停服后丢失。
# 更换存储连接不会迁移原数据。
database:
  type: "yml"
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "minecraft"
    username: "root"
    password: "password"
    pool-size: 10
    min-idle: 2
    max-lifetime: 1800000
    connection-timeout: 10000
    idle-timeout: 600000
