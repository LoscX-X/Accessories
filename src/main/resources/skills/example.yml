# 饰品通过 acc_item_id 或显式配置的显示名识别。
# MythicMobs 的技能本体、伤害和 Conditions 写在 MythicMobs 中。
items:
  example_ring:
    name: "示例戒指"
    skills:
      - id: attack
        skill: ExampleAttackSkill
        trigger: onAttack
        target: targeted
        cooldown: 5
        cd: 1
        cd-format: "攻击 {cd}s"
      - id: pulse
        skill: ExampleTimerSkill
        trigger: onTimer
        period: 20
        target: self
      - id: rescue
        skill: ExampleDeathSkill
        trigger: onDeath
        target: self
        forcesync: true
        cancelevent: false

# trigger: onAttack / onCriticalHit / onDamaged / onShoot / onKill /
#          onDeath / onTimer / onSkillCast / onInteract
# onInteract：主手右键，尊重物品交互禁止；快捷装备已处理的交互不会再触发技能。
# target 可省略，按触发方式自动使用合理默认；self / targeted / attacker / projectile / none。
# period：仅 onTimer，单位 tick，默认 20。cooldown：秒，默认 0。
# cd：固定展示槽 1..10，可省略并自动排序；%blacc_cd_1% 至 %blacc_cd_10%。
# id：稳定技能标识，省略时为 skill@trigger；同一物品中不能重复。
# 复制同种饰品只注册一次同一能力；换槽、重排配置不会重置冷却。
