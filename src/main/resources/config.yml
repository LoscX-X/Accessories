# 当前版本只读取以下分组。群体使用哪套背包请配置 profiles/，槽位外观请配置 layouts/。
general:
  language: en_US

inventory:
  # 布局文件省略 title / size 时采用的默认值。
  title: "<green>饰品背包 <gray>{page}/{max_page}"
  size: 9
  quick-equip:
    shift-right-click: true
  anti-unequip:
    lore: ["[Anti-unequip]"]
  item-limits:
    example_ring:
      id: example_ring
      max: 1

attribute:
  # 只能选择一个外部属性来源：none / AuraSkills / AttributePlus / BlancAttribute。
  # 只使用原版属性：provider: none + vanilla: true。不会自动选择其他插件。
  provider: none
  vanilla: true
  lore:
    enable: false
    mappings:
      health:
        attribute: minecraft:max_health
        keywords: [生命, health]

skills:
  # 独立的 MythicMobs 技能系统；未安装依赖时不启动。技能定义放在 skills/。
  enabled: true
  triggers:
    # 需要免伤 aura 在伤害取消后也触发时才开启。
    cancelled-damage: false
  cooldowns:
    # 冷却默认属于登录会话；死亡、换槽和切换 profile 均不会重置。
    reset-on-quit: true

lifecycle:
  # keep / drop / follow-keep-inventory
  death: keep

debug:
  enabled: false
  categories: [lifecycle, inventory, skills, hooks, storage]
  # 同类事件的最短日志间隔，单位 tick；0 表示不节流。
  interval-ticks: 20

aura:
  physical-shield:
    out-of-combat-seconds: 12
    regen-percent: 0.10
  magic-shield:
    out-of-combat-seconds: 12
    regen-percent: 0.10
  life-steal:
    show-heal-message: false

storage:
  # yml / mysql / only-ram。RAM 专用于小游戏，退出后清空，不写入持久化存储。
  type: yml
  # 仅迁移旧物品数据时使用：依次填写旧背包每页的大小，例如 [9, 27]。
  # 新数据以固定页号/槽号保存；修改 profile 不会改变存储位置。
  legacy-page-sizes: []
  mysql:
    host: 127.0.0.1
    port: 3306
    database: minecraft
    username: root
    password: password
    pool-size: 10
    min-idle: 2
    max-lifetime: 1800000
    connection-timeout: 10000
    idle-timeout: 600000
