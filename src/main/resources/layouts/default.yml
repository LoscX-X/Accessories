# 可复用页面布局：文件名（不带 .yml）就是布局 ID。
# 在 profiles/<群体>.yml 的 inventory.pages 中使用此布局名。
# size 可省略以使用主配置默认值；title 也可按布局覆盖。
size: 9

# 当前页通过 AccessoryService API 在运行时禁用的槽位样式
disabled-slot:
  item:
    type: "RED_STAINED_GLASS_PANE"
    hide-tooltip: true
    name: "<red>Slot Disabled"
    lore:
      - "<dark_red>This slot is disabled"

# 当前页面的插槽规则：每个槽位允许放入的物品 lore 关键词
# 同时支持 permission 检测
slots:
  "1":
    # permission: "accessory.slot.ring"
    lore:
      - "[Ring]"
  "3":
    lore:
      - "[Necklace]"
  "5":
    lore:
      - "[Bracelet]"
  "7":
    lore:
      - "[Talisman]"

# 当前页面物品/边框配置。每个物品自己配置 slots，可放置多个不同物品。
# action: "command" 时点击该物品会执行 command.console / command.player；也支持 "previous_page" / "next_page" 翻页。
frame:
  locked:
    slots: [2, 4, 6]
    type: "BLACK_STAINED_GLASS_PANE"
    custom-model-data: 12345
    hide-tooltip: true
    name: "<gray>Locked"
    lore:
      - "<dark_gray>Slot is locked"
  next_button:
    slots: [8]
    type: "ARROW"
    custom-model-data: 12345
    hide-tooltip: true
    name: "<gray>Next Page"
    lore:
      - "<dark_gray>Go to next page"
    action: "next_page"
  help:
    slots: []
    type: "BOOK"
    hide-tooltip: false
    name: "<aqua>Help"
    lore:
      - "<gray>Click for help"
    action: "command"
    command:
      console:
        - "say {player} clicked accessory page {page} slot {slot}"
      player:
        - "help"
