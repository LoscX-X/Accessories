# 饰品背包 GUI 顶部显示的标题（支持变量 {page} / {max_page}）
title: "<gradient:#00ffa6:#00d1ff><b>Accessories {page}/{max_page}</b></gradient>"

# 默认 GUI 大小；每页可在 /plugins/Accessory/page/*.yml 中用 size 覆盖。
size: 9

# 总页数
pages: 2

# 语言文件名称（位于 /plugins/Accessory/Language 目录下，不带 .yml 后缀）
# 默认可用：en_US, zh_CN
# 语言消息默认使用 MiniMessage 格式，例如 <green>成功</green>。
Lang: "en_US"

# 是否开启启动调试日志
debug-mode: false

# 是否开启饰品技能调试日志（包括识别、触发目标与 MythicMobs 施法结果）
skill-debug: false

# 属性挂钩模式（默认关闭）
# false: 使用 AuraSkills trait（如果存在）
# true: 只使用 AttributePlus，忽略 AuraSkills trait
attribute-plus:
  enable: false

# 原版属性 Lore 映射（仅在未接入 AuraSkills / AttributePlus 的原版属性加载模式下生效）
# enable: 是否启用通过 lore 文本同步追加原版属性
# mappings:
#   <自定义名称>:
#     attribute: "minecraft:max_health" # 要追加的原版属性 ID
#     keywords: [ "生命" ]              # lore 中包含任意关键词时读取数值
#
# 支持格式示例（兼容 MiniMessage 显示后的纯文本）:
#   生命: +5    -> ADD_NUMBER +5
#   生命: -5    -> ADD_NUMBER -5
#   生命: x1.2  -> MULTIPLY_SCALAR_1 +0.2（倍率会自动换算为 Bukkit 属性倍率）
vanilla-lore-attributes:
  enable: false
  mappings:
    health:
      attribute: "minecraft:max_health"
      keywords:
        - "生命"
        - "health"

# 快速装备：玩家潜行 + 右键点击时，检测主手饰品，自动按 lore 匹配饰品槽位并切换。
# 如果多个槽位使用相同 lore（例如 [Ring]），会在聊天栏显示可点击选项。
quick-equip:
  shift-right-click: true

# 禁止卸下：已装备饰品的 lore 包含以下任一关键词时，无法从饰品栏取下/被快捷装备替换
anti-unequip:
  lore:
    - "[Anti-unequip]"

# 存储方式: yml、mysql 或 only-ram
# only-ram: 只保存在运行内存中，重载存储或关闭服务器后数据会丢失。
database:
  type: "yml"
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "minecraft"
    username: "root"
    password: "password"
    pool-size: 10
    min-idle: 2
    max-lifetime: 1800000
    connection-timeout: 10000
    idle-timeout: 600000

# 饰品页面配置请放在 /plugins/Accessory/page/*.yml 中。
# 每个页面文件都必须内置 page: <页码>，文件名可以自定义；缺失 page 会在控制台报错并跳过。
# 示例文件：page/page1.yml、page/page2.yml

# 页面物品/边框配置请放在 /plugins/Accessory/page/*.yml 的 frame 下；每个物品自行配置 slots。

# 运行时禁用槽位样式请放在 /plugins/Accessory/page/*.yml 的 disabled-slot 下。
# 翻页按钮请放在 /plugins/Accessory/page/*.yml 的 frame 下，并使用 drag: "pre_page" / "next_page"。
# 物理护盾恢复设置
OUT_OF_COMBAT_SECONDS: 12
SHIELD_REGEN_PERCENT: 0.10

# 魔法护盾恢复设置
MAGIC_SHIELD_OUT_OF_COMBAT_SECONDS: 12
MAGIC_SHIELD_REGEN_PERCENT: 0.10

# 是否显示吸血效果的调试演示数值
Life_Steal_demonstrate: false

# 同一物品最多可同时装备/生效的数量（skilled_item 数量检测）
# 每条规则支持:
#   id:       技能/饰品 ID（acc_item_id / dun_item_id）
#   name:     物品显示名（包含匹配，可写字符串或列表）
#   lore:     lore 关键词列表（命中任意一个即匹配）
#   material: 材料名，如 DIAMOND_SWORD
#   max:      最多可装备次数（<=0 表示不限制）
# 不写 id/name/lore/material 时，规则键名会同时作为 ID、显示名和 lore 关键词兜底匹配。
item-limits:
  example_ring:
    id: example_ring
    max: 1
